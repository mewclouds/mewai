# --- generated by mewai from core/policy/policy.json. Do not edit. ---
# These block unconditionally, before --yolo, /yolo, and approvals.mode off.
# Change core/policy/policy.json and run scripts/render.ps1.
approvals:
  deny:
    - "*git push --force*"
    - "*git push -f*"
    - "*git push --force-with-lease*"
    - "*git reset --hard*"
    - "*git clean*"
    - "*git rebase --interactive*"
    - "*git filter-branch*"
    - "*git push * --force*"
    - "*git push * -f*"
    - "*git push * -f *"
    - "*git checkout --*"
    - "*git restore --staged --worktree*"
    - "*git stash drop*"
    - "*git stash clear*"
    - "*git branch -D*"
    - "*gh repo delete*"
    - "*gh release delete*"
    - "*gh cache delete*"
    - "*/.env*"
    - "* .env*"
    - "*/.env.**"
    - "* .env.**"
    - "*/*.pem*"
    - "* *.pem*"
    - "*/id_rsa*"
    - "* id_rsa*"
    - "*/id_ed25519*"
    - "* id_ed25519*"
    - "*/.ssh/*"
    - "* .ssh/*"
    - "*/.aws/credentials*"
    - "* .aws/credentials*"
    - "*/.codex/auth.json*"
    - "* .codex/auth.json*"
    - "*/.claude/.credentials.json*"
    - "* .claude/.credentials.json*"
    - "*git commit*"
hooks:
  pre_tool_call:
    - matcher: "read_file"
      command: "~/AppData/Local/hermes/hooks/mewai-hook.cmd"
      timeout: 15
      fail_closed: true
hooks_auto_accept: true
# --- end generated ---
# Base Hermes settings owned by mewai. The approvals block is generated from
